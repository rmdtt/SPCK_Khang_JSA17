<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Meals</title>
    <link rel="stylesheet" href="Search.css">
</head>

<body>

    <div class="Background">
        <img src="Img/Main_bg.png" alt="Background">

        <nav class="navbar">

            <div class="logo">
                <a href="Main.html">CookBook</a>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Tìm món ăn...">
                <button id="searchBtn">Search</button>
            </div>

            <ul class="nav-links">
                <li>
                    <a href="Main.html">Home</a>
                </li>

                <li>
                    <a href="Recipes.html">Recipes</a>
                </li>
            </ul>

            <div class="container">

                <div class="account">
                    <span id="username"></span>

                    <img id="avatar" src="Img/Avatar.png" alt="Avatar">
                </div>

                <div id="dropdown" class="dropdown">

                    <label for="avatarInput">
                        Change Avatar
                    </label>

                    <input type="file" id="avatarInput" accept="image/*" hidden>

                    <button id="logoutBtn">
                        Logout
                    </button>

                </div>

            </div>

        </nav>

        <main class="main-content">

            <div class="search-header">
                <h1 id="searchTitle"></h1>
            </div>

            <div id="searchResults" class="search-results"></div>

        </main>

    </div>

    <footer class="footer">
        <h2>CookBook</h2>
        <p>Chia sẻ công thức, khám phá món ăn.</p>
        <p>© 2026 CookBook. All rights reserved.</p>
    </footer>

    <script src="Search.js"></script>

</body>

</html>
