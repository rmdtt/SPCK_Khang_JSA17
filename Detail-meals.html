<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Detail-meals.css">
    <title>Details</title>
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <a href="Main.html">CookBook</a>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Tìm món ăn...">
            <button>Search</button>
        </div>

        <ul class="nav-links">
            <li><a href="Main.html">Main</a></li>
            <li><a href="Recipes.html">Recipes</a></li>
        </ul>

        <div class="container">
            <div class="account">
                <span id="username"></span>
                <img id="avatar" src="Img/Avatar.png" alt="Avatar">
                <input type="file" id="avatarInput" accept="image/*" hidden>
            </div>

            <div class="dropdown" id="dropdown">
                <label for="avatarInput">Đổi ảnh đại diện</label>
                <button id="logoutBtn">Đăng xuất</button>
            </div>
        </div>
    </nav>


    <div class="Background">
        <img id="backgroundImage">
        <div class="container-details">
            <div class="meal-detail">
                <h1 id="mealName"></h1>
                <img id="mealImage" alt="Meal Image">
            </div>
        </div>


        <div class="Ingredients">
            <h2>Ingredients</h2>
            <div id="ingredientList">
            </div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="Detail-meals.js"></script>
</body>

</html>
